services:
  - type: web
    name: hospitaliq-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospitaliq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ENVIRONMENT
        value: production
      - key: SKIP_DB_INIT
        value: "0"

databases:
  - name: hospitaliq-db
    plan: free
    databaseName: hospitaliq
    user: hospitaliq
