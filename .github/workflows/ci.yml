name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Python Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check backend/ ml_pipeline/

      - name: Test with pytest (with coverage gating ≥70%)
        run: pytest -v --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=70
        env:
          SKIP_DB_INIT: "1"
          DATABASE_URL: "sqlite:///./test_hospitaliq.db"
          SECRET_KEY: "test-secret-key-for-ci-at-least-32-chars"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  java-test:
    name: Java Tests (Spring Boot Patient Service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run Maven tests (unit + slice + integration)
        run: ./mvnw test --batch-mode --no-transfer-progress
        env:
          # Dummy values for tests — H2 in-memory DB used by all test profiles
          JWT_SECRET_KEY: "ci-test-secret-key-at-least-32-chars-padding"
          SPRING_JPA_DDL_AUTO: "create-drop"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report
          path: patient-service/target/surefire-reports/

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

