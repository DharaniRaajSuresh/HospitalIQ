[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "hospitaliq"
version = "2.0.0"
description = "AI-powered hospital capacity & patient risk management system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    "google-generativeai>=0.5.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "joblib>=1.4.2",
    # OpenTelemetry — used in backend/core/tracing.py for distributed tracing
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
frontend = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "geopandas",
]

[tool.setuptools.packages.find]
include = ["backend*", "ml_pipeline*"]

[tool.ruff]
line-length = 120
# Match requires-python: target Python 3.11 (not 3.12) for broadest compat
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]   # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["slow: marks tests as slow"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
addopts = "--cov=backend --cov-report=term-missing"

