# Docker Compose — HospitalIQ full stack
# Services: FastAPI ML API, Spring Boot Patient Service, React (Nginx), PostgreSQL
#
# IMPORTANT: Replace all 'change-me' values with real secrets before deploying.
# The JWT_SECRET_KEY MUST match between 'api' and 'patient-service' services —
# both services validate the same JWT tokens issued by the FastAPI auth module.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hospitaliq:${DB_PASSWORD:-change-me}@db:5432/hospitaliq_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  patient-service:
    build: ./patient-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/hospitaliq_db
      - SPRING_DATASOURCE_USERNAME=hospitaliq
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-change-me}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DDL_AUTO=validate
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - patient-service

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=hospitaliq
      - POSTGRES_PASSWORD=change-me
      - POSTGRES_DB=hospitaliq_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitaliq -d hospitaliq_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
